name: Build ThingsBoard CE

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:  # เพิ่มปุ่ม Run workflow ด้วยมือ

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Node.js (v18.19+)
      uses: actions/setup-node@v3
      with:
        node-version: '18.19'

    - name: Install frontend dependencies
      working-directory: ui-ngx
      run: |
        npm install
        npm run build

    - name: Build backend (skip tests)
      run: mvn clean install -DskipTests
